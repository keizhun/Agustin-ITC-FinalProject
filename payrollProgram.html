<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Payroll Program</title>
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="navBar"></div>

<h1 style="margin-top: 100px;">Simple Payroll Program</h1>

<div class="payrollContainer">

  <div class="inputCard">
    <h3>Add Employee</h3>

    <label>Employee Name</label>
    <input type="text" id="textEmpName" placeholder="John Doe">

    <label>Days Worked</label>
    <input type="number" id="textDaysWorked" placeholder="0">

    <label>Daily Rate</label>
    <input type="text" id="textDailyRate" placeholder="₱0" oninput="formatCurrency(this)">

    <label>Deduction</label>
    <input type="text" id="textDeduction" placeholder="₱0" oninput="formatCurrency(this)">

    <button id="btnAdd">Add Employee</button>

    <hr>

    <label>Delete Employee Record</label>
    <input type="number" id="textDeleteNo" placeholder="Employee number">
    <button id="btnDelete">Delete</button>

    <button id="btnDeleteAll">Clear All</button>
  </div>

  <!-- Table (Right) -->
  <div class="tableCard">
    <table>
      <thead>
      <tr>
        <td>No.</td>
        <td>Employee Name</td>
        <td>Days Worked</td>
        <td>Daily Rate</td>
        <td>Gross Pay</td>
        <td>Deduction</td>
        <td>Net Pay</td>
      </tr>
      </thead>

      <tbody id="tableBody"></tbody>

      <tfoot>
      <tr>
        <td colspan="4" style="text-align: center; font-weight: bold;">Total</td>
        <td id="tGrossPay" class="numdata">0.00</td>
        <td id="tDeduction" class="numdata">0.00</td>
        <td id="tNetPay" class="numdata">0.00</td>
      </tr>
      </tfoot>
    </table>
  </div>


</div>

<dialog id="dlgDelete">
  <form method="dialog">
    <p style="font-size: 20px"  id="dlgDeleteMsg"></p>

    <div class="modalButtons">
      <button id="btnConfirmDelete" value="confirm">Confirm</button>
      <button id="btnCancelDelete" value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="dlgDeleteAllConfirm">
  <form method="dialog">
    <p style="font-size: 20px">Are you sure?</p>

    <div class="modalButtons">
      <button id="btnYesDeleteAll" value="yes">Yes</button>
      <button id="btnNoDeleteAll" value="no">No</button>
    </div>
  </form>
</dialog>


<script src="js/navigationBar.js"></script>
<script>loadNavbar()</script>
<script src="js/payrollProgram.js"></script>

</body>
</html>
